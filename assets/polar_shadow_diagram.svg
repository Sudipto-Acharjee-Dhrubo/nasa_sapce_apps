<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>

    <!-- Solar Ray Gradient -->
    <linearGradient id="sunbeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffb733" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffcc66" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ffe699" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Sun Disk Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffe066"/>
      <stop offset="60%" stop-color="#ff9900" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Gradient -->
    <linearGradient id="shadowCone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#010205" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Earth Glow -->
    <radialGradient id="earthGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#70c4ff"/>
      <stop offset="50%" stop-color="#0066cc"/>
      <stop offset="90%" stop-color="#002255"/>
      <stop offset="100%" stop-color="#001122"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Subtle Space Grid Lines -->
  <g stroke="rgba(0,130,243,0.07)" stroke-width="1">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>

  <!-- Starry Sky Dots -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="280" cy="140" r="1"/>
    <circle cx="450" cy="90" r="2" opacity="0.9"/>
    <circle cx="620" cy="180" r="1.2"/>
    <circle cx="890" cy="70" r="1.5"/>
    <circle cx="1120" cy="130" r="2" opacity="0.95"/>
    <circle cx="1340" cy="85" r="1"/>
    <circle cx="1520" cy="160" r="1.8"/>
    <circle cx="1780" cy="95" r="1.2"/>
    <circle cx="1850" cy="240" r="1.5"/>
    <circle cx="210" cy="310" r="1.2"/>
    <circle cx="980" cy="270" r="1"/>
    <circle cx="1410" cy="290" r="1.6"/>
  </g>

  <!-- ================= TOP HEADER BAR ================= -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="360" height="30" rx="4" fill="rgba(232,75,240,0.15)" stroke="rgba(232,75,240,0.5)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#e84bf0"/>
    <text x="30" y="20" fill="#e84bf0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">NASA SPACE APPS 2026 · TEAM VOIDBRONE</text>

    <text x="0" y="70" fill="#ffffff" font-family="'Anton', Impact, sans-serif" font-size="44" letter-spacing="1.5">THE LUNAR SOUTH POLE SHADOW CRISIS</text>
    <text x="0" y="105" fill="#7d8ea6" font-family="'Roboto Condensed', sans-serif" font-size="20" letter-spacing="0.5">Ultra-low grazing solar elevation (~1.5°) causes crater rims to cast permanent 30+ km freezing shadows.</text>
  </g>

  <!-- ================= SUN & GRAZING SOLAR RAYS ================= -->
  <!-- Low Sun on the Far Left -->
  <g transform="translate(130, 680)">
    <!-- Sun Corona Rays -->
    <circle cx="0" cy="0" r="120" fill="url(#sunGlow)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="50" fill="#ffffff"/>
    
    <!-- Sun Label -->
    <rect x="-80" y="70" width="160" height="34" rx="4" fill="rgba(8,16,32,0.85)" stroke="#e8a24a" stroke-width="1.5"/>
    <text x="0" y="93" fill="#e8a24a" font-family="'Roboto Condensed', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">☀️ SUN (LOW GRAZING)</text>
    <text x="0" y="125" fill="#ffe699" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">Elevation: ~1.5° above horizon</text>
  </g>

  <!-- Tangent Angle Visual Guide (1.5 deg dashed ray) -->
  <line x1="130" y1="680" x2="880" y2="655" stroke="#ffb733" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>
  
  <!-- Parallel Golden Sunlight Beams -->
  <polygon points="130,620 1920,570 1920,650 880,655 130,680" fill="url(#sunbeam)" opacity="0.45"/>
  <line x1="130" y1="650" x2="880" y2="655" stroke="#ffdd66" stroke-width="3" filter="url(#laserGlow)" opacity="0.9"/>
  <line x1="130" y1="680" x2="880" y2="655" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="880" y1="655" x2="1920" y2="615" stroke="#ffdd66" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- ================= LUNAR TOPOGRAPHY (CRATER RIM & VALLEY) ================= -->
  <!-- Shadow Cone Zone Behind Mountain (Permanently Shadowed Region) -->
  <polygon points="880,655 1920,615 1920,1080 880,1080" fill="url(#shadowCone)"/>

  <!-- Deep Cold Hatching inside Shadow -->
  <g stroke="rgba(0,130,243,0.12)" stroke-width="1.5">
    <line x1="940" y1="720" x2="1140" y2="920"/>
    <line x1="1040" y1="720" x2="1240" y2="920"/>
    <line x1="1140" y1="720" x2="1340" y2="920"/>
    <line x1="1240" y1="720" x2="1440" y2="920"/>
    <line x1="1340" y1="720" x2="1540" y2="920"/>
    <line x1="1440" y1="720" x2="1640" y2="920"/>
    <line x1="1540" y1="720" x2="1740" y2="920"/>
    <line x1="1640" y1="720" x2="1840" y2="920"/>
  </g>

  <!-- Lunar Terrain Base Polygon (Illuminated Plain + Mountain + Crater Basin) -->
  <path d="M 0,860 
           Q 240,850 460,820 
           Q 620,800 740,730 
           L 880,655 
           L 960,780 
           Q 1120,890 1380,910 
           Q 1620,915 1780,880 
           L 1920,850 
           L 1920,1080 
           L 0,1080 Z" 
        fill="#0b1322" stroke="#253a5c" stroke-width="3"/>

  <!-- Illuminated Sunlight Crest on Mountain Face -->
  <path d="M 0,860 Q 240,850 460,820 Q 620,800 740,730 L 880,655" 
        stroke="#ffcc44" stroke-width="6" fill="none" filter="url(#glow)"/>

  <!-- Mountain Peak Dot & Callout -->
  <circle cx="880" cy="655" r="7" fill="#ffffff" stroke="#ffaa00" stroke-width="3"/>
  <g transform="translate(730, 520)">
    <rect x="0" y="0" width="280" height="74" rx="6" fill="rgba(8,16,32,0.92)" stroke="#22c55e" stroke-width="2"/>
    <circle cx="20" cy="22" r="6" fill="#22c55e"/>
    <text x="36" y="27" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">SUNLIT PEAK (+1,900 m)</text>
    <text x="18" y="50" fill="#ffffff" font-family="'Roboto Condensed', sans-serif" font-size="14">Solar illumination reaches high ridges.</text>
    <text x="18" y="66" fill="#7d8ea6" font-family="'Roboto Condensed', sans-serif" font-size="12">e.g. Connecting Ridge / Shackleton Rim</text>
    <line x1="150" y1="74" x2="150" y2="135" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- ================= THE DEEP SHADOW & STRANDED LANDER ================= -->
  <!-- Shadow Span Dimension Arrow (30+ km) -->
  <g transform="translate(890, 705)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#ea384c" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="0,0 12,-5 12,5" fill="#ea384c"/>
    <polygon points="880,0 868,-5 868,5" fill="#ea384c"/>
    <rect x="290" y="-18" width="300" height="34" rx="4" fill="#081020" stroke="#ea384c" stroke-width="1.5"/>
    <text x="440" y="4" fill="#ea384c" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">◀ 30+ km SHADOW CAST ▶</text>
  </g>

  <!-- Stranded Lander Graphic inside Crater Floor -->
  <g transform="translate(1380, 845)">
    <!-- Lander Body Silhouette -->
    <!-- Legs -->
    <line x1="-35" y1="65" x2="-18" y2="25" stroke="#a0aec0" stroke-width="3"/>
    <line x1="35" y1="65" x2="18" y2="25" stroke="#a0aec0" stroke-width="3"/>
    <line x1="0" y1="65" x2="0" y2="25" stroke="#a0aec0" stroke-width="3"/>
    <circle cx="-35" cy="65" r="4" fill="#718096"/>
    <circle cx="35" cy="65" r="4" fill="#718096"/>
    <!-- Hull Octagon -->
    <polygon points="-22,25 22,25 28,0 18,-20 -18,-20 -28,0" fill="#2d3748" stroke="#cbd5e0" stroke-width="2"/>
    <!-- Antenna Mast -->
    <line x1="0" y1="-20" x2="0" y2="-45" stroke="#cbd5e0" stroke-width="2"/>
    <path d="M -12,-45 A 12 12 0 0 1 12,-45" fill="none" stroke="#ea384c" stroke-width="2"/>
    <!-- Solar Panels (Cold / Inactive) -->
    <rect x="-50" y="-10" width="22" height="14" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
    <rect x="28" y="-10" width="22" height="14" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
    <!-- Red Blinking Beacon -->
    <circle cx="0" cy="-45" r="3" fill="#ea384c" filter="url(#glow)"/>

    <!-- Warning / Danger Box Callout -->
    <g transform="translate(-160, -210)">
      <rect x="0" y="0" width="330" height="135" rx="8" fill="rgba(12,8,16,0.95)" stroke="#ea384c" stroke-width="2"/>
      <rect x="0" y="0" width="330" height="30" rx="8" fill="rgba(234,56,76,0.2)"/>
      <text x="16" y="21" fill="#ea384c" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">⚠️ PERMANENT SHADOW (PSR)</text>
      
      <text x="16" y="54" fill="#ffffff" font-family="'Roboto Condensed', sans-serif" font-size="15" font-weight="700">LANDER POWER FAILURE</text>
      <text x="16" y="76" fill="#cbd5e0" font-family="'Roboto Condensed', sans-serif" font-size="13">• Solar Panels: 0% power generation</text>
      <text x="16" y="96" fill="#cbd5e0" font-family="'Roboto Condensed', sans-serif" font-size="13">• Extreme Cold: -200°C (-328°F)</text>
      <text x="16" y="116" fill="#ff7070" font-family="'Roboto Condensed', sans-serif" font-size="13">• Battery depletes after ~80 hours</text>
      
      <line x1="165" y1="135" x2="165" y2="160" stroke="#ea384c" stroke-width="2"/>
    </g>
  </g>

  <!-- ================= EARTH & LINE-OF-SIGHT COMMS ================= -->
  <!-- Earth Hovering Low -->
  <g transform="translate(1750, 380)">
    <circle cx="0" cy="0" r="45" fill="url(#earthGlow)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0082f3" stroke-width="2"/>
    
    <!-- Earth Label -->
    <rect x="-70" y="58" width="140" height="32" rx="4" fill="rgba(8,16,32,0.9)" stroke="#0082f3" stroke-width="1.5"/>
    <text x="0" y="79" fill="#0082f3" font-family="'Roboto Condensed', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">🌍 EARTH</text>
    <text x="0" y="108" fill="#70c4ff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">Low Elevation: +3° to +8°</text>
  </g>

  <!-- Blocked Line-of-Sight Comms Beam from Earth to Crater Floor -->
  <line x1="1710" y1="400" x2="880" y2="655" stroke="#0082f3" stroke-width="2.5" stroke-dasharray="8,6" opacity="0.8"/>
  <circle cx="880" cy="655" r="14" fill="none" stroke="#ea384c" stroke-width="3" filter="url(#glow)"/>
  <text x="895" y="640" fill="#ea384c" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">✗ TERRAIN BLOCKS COMMS</text>

  <!-- ================= BOTTOM KEY TAKEAWAYS BAR ================= -->
  <g transform="translate(80, 960)">
    <rect x="0" y="0" width="1760" height="80" rx="8" fill="rgba(4,7,16,0.92)" stroke="rgba(0,130,243,0.3)" stroke-width="1.5"/>
    
    <g transform="translate(30, 25)">
      <text x="0" y="0" fill="#e8a24a" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">1. GRAZING SUN</text>
      <text x="0" y="24" fill="#cbd5e0" font-family="'Roboto Condensed', sans-serif" font-size="15">Sun never rises high. Ridges create colossal shadow zones.</text>
    </g>

    <line x1="560" y1="15" x2="560" y2="65" stroke="rgba(255,255,255,0.1)"/>

    <g transform="translate(600, 25)">
      <text x="0" y="0" fill="#ea384c" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">2. PERMANENT COLD SHADOWS</text>
      <text x="0" y="24" fill="#cbd5e0" font-family="'Roboto Condensed', sans-serif" font-size="15">A 1,000 m ridge casts a 38 km dark shadow. Batteries freeze at -200°C.</text>
    </g>

    <line x1="1200" y1="15" x2="1200" y2="65" stroke="rgba(255,255,255,0.1)"/>

    <g transform="translate(1240, 25)">
      <text x="0" y="0" fill="#0082f3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">3. EARTH LINE-OF-SIGHT</text>
      <text x="0" y="24" fill="#cbd5e0" font-family="'Roboto Condensed', sans-serif" font-size="15">Lander antennas must clear crater rims to keep DSN carrier link active.</text>
    </g>
  </g>
</svg>

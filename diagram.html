<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunar South Pole Lighting & Shadow Crisis · Team VOIDBRONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Condensed:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#010206;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .container{width:100%;max-width:1920px;max-height:1080px;aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center}
    img{width:100%;height:100%;object-fit:contain;display:block}
    .nav-bar{
      position:fixed;top:16px;left:20px;z-index:100;
      opacity:0;transition:opacity .3s ease;
    }
    body:hover .nav-bar{opacity:1}
    .btn{
      background:rgba(4,7,16,0.85);color:#fff;border:1px solid rgba(0,130,243,0.4);
      padding:8px 16px;border-radius:6px;font:600 12px 'Roboto Condensed',sans-serif;
      text-decoration:none;letter-spacing:1px;text-transform:uppercase;
      backdrop-filter:blur(8px);transition:background .2s;display:inline-block;
    }
    .btn:hover{background:rgba(0,130,243,0.3)}
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="index.html" class="btn">← Back to Horizon Atlas</a>
  </div>
  <div class="container">
    <img src="assets/polar_shadow_diagram.svg" alt="Lunar South Pole Lighting and Shadow Crisis Animated Diagram">
  </div>
</body>
</html>
